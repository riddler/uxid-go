# mise config for uxid-go: the toolchain and the gate tasks.
#
#   mise install          provision the toolchain below
#   mise run gate:loop    inner loop: vet, test
#   mise run gate         full gate, the advancement gate
#
# The Go toolchain is pinned here; go.mod declares `go 1.26`, the oldest Go
# the module supports, while the toolchain that builds and gates it is this
# one. The tools are pinned here, never through a `tool` directive in go.mod.
# govulncheck comes through mise's go backend, which compiles it with the
# Go toolchain above, so `go` is listed first and installs first.

[tools]
go = "1.27"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[tasks."gate:fmt"]
description = "Fail when gofmt lists any file"
run = '''
out=$(gofmt -l .)
if [ -n "$out" ]; then
  echo "gofmt lists these files:" >&2
  echo "$out" >&2
  exit 1
fi
'''

[tasks."gate:vet"]
description = "go vet"
run = "go vet ./..."

[tasks."gate:lint"]
description = "golangci-lint"
run = "golangci-lint run ./..."

[tasks."gate:test"]
description = "Test with the race detector and a coverage profile, the conformance corpus included"
run = "go test -race -covermode=atomic -coverprofile=coverage.out ./..."

[tasks."gate:coverage"]
description = "Fail under 90 percent of statements"
run = "scripts/coverage-floor.sh coverage.out"

[tasks."gate:vulncheck"]
description = "govulncheck (reaches the network for the vulnerability database)"
run = "govulncheck ./..."

[tasks."gate:release-guard"]
description = "Run the release workflow's checks against fixture values"
run = "sh scripts/release-guard-test.sh"

[tasks."gate:loop"]
description = "Inner loop: vet, test"
run = [
  { task = "gate:vet" },
  { task = "gate:test" },
]

[tasks.gate]
description = "Full gate"
run = [
  { task = "gate:fmt" },
  { task = "gate:vet" },
  { task = "gate:lint" },
  { task = "gate:test" },
  { task = "gate:coverage" },
  { task = "gate:vulncheck" },
  { task = "gate:release-guard" },
]
